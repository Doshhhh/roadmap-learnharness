name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck is intentionally not run here: the LearnHarness plugin SDK
      # types (.sdk/) are not in the repository, so `tsc` would always fail in CI.
      # Run `npm run check` locally where .sdk/ is present.
      - run: node scripts/check-version.mjs

      - run: npm run build

      - run: npm test
